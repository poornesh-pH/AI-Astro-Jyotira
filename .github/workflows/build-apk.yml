name: Build APK
 
# Produces a real, installable Android APK as a downloadable artifact.
# Trigger: push to main, or run manually from the Actions tab.
 
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (e.g. https://your-app.vercel.app/api)"
        required: false
        default: ""
      revenuecat_key:
        description: "RevenueCat Android public SDK key (goog_...)"
        required: false
        default: ""
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - name: Generate Android platform files
        run: flutter create --org com.jyotira --project-name jyotira --platforms=android .
 
      - name: Install dependencies
        run: flutter pub get
 
      - name: Generate localizations
        run: flutter gen-l10n
 
      - name: Analyze
        run: flutter analyze || true
 
      - name: Build debug APK (installable test build)
        run: >
          flutter build apk --debug
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url }}
          --dart-define=REVENUECAT_ANDROID_KEY=${{ github.event.inputs.revenuecat_key }}
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jyotira-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
